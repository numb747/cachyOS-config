# Adwaita Mono（adwaita-fonts，Iosevka 派生）：字身窄、字重轻、字怀干净，
# 比 Meslo / Noto Sans Mono 那种等宽"办公体"清秀，配 tokyonight 的低对比配色更耐看。
# 代价是它不带 Nerd Font 图标，见下面的 symbol_map。
font_family                 Adwaita Mono

# 默认 11pt 偏小，是因为 noctalia 的 ui_scale = 1.20 只放大了桌面 UI，
# kitty 没跟上（108 DPI，2560x1440 / 27"，scale 1）。
# 按比例该到 13.2，但那样字太胖不好看 —— 取 12.5，只往上抬一档。
font_size                   12.5

# 优雅靠行距，不靠字号：窄字形 + 宽行距，正文成行更透气，
# 眼睛扫行不费劲，字号还能压得住。
modify_font                 cell_height 108%

# Adwaita Mono 没有 Nerd Font 私用区字形，单独映射给 Meslo，
# 否则 shell 里那个 nvim 的图标全是豆腐块。
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+EFCE,U+F000-U+F2FF,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 MesloLGS Nerd Font Mono

background_opacity          0.6
cursor_trail                1
window_padding_width        25

# 启动即进 nvim 并落进内置终端（旧机 wezterm default_prog 的等价物）。
#   -c terminal      开内置终端
#   -c startinsert   直接进插入模式，可以立刻打字
#   -c tnoremap ...  双击 Esc 退回普通模式
# 必须用单引号：kitty 对 shell 的值走 shlex_split 再做 $ 变量展开
# （kitty/utils.py 的 resolved_shell），单引号内的 \ 原样保留；
# 换双引号就得写成 <C-\\><C-n>。
# 想开纯 shell 窗口：kitty zsh —— 命令行给了程序就会覆盖这一行。
shell nvim -c terminal -c startinsert -c 'tnoremap <Esc><Esc> <C-\><C-n>'

include themes/noctalia.conf
