# 终端壁纸（替代毛玻璃）—— kitty.conf 里 include 本文件即启用，注释掉即回到毛玻璃
# 原图在 ~/Pictures/Wallpapers/kitty-bg/（来自 wallhaven，已缩到 2560x1440）；
# 切图、调暗都由 ~/.local/bin/kitty-bg 完成，它把当前那张（已压暗）软链成下面这个文件。
# 文件不存在（壁纸被关掉）时 glob 匹配不到，kitty 就退回毛玻璃。

background_image         ~/.cache/kitty-bg/current.jpg
# cscaled = 保持比例铺满；挑的是人物偏右/偏中的图
background_image_layout  cscaled
background_image_linear  yes
# 暗度不靠 tint（往背景色 #232136 上混，压不黑），靠 kitty-bg 直接压原图亮度
background_tint          0

# Ctrl+Shift+F1/F2 下一张/上一张 · F3/F4 更暗/更亮（每次 10%）· F12 开关壁纸
map ctrl+shift+f1  launch --type=background --allow-remote-control /home/david/.local/bin/kitty-bg next
map ctrl+shift+f2  launch --type=background --allow-remote-control /home/david/.local/bin/kitty-bg prev
map ctrl+shift+f3  launch --type=background --allow-remote-control /home/david/.local/bin/kitty-bg darker
map ctrl+shift+f4  launch --type=background --allow-remote-control /home/david/.local/bin/kitty-bg lighter
map ctrl+shift+f12 launch --type=background --allow-remote-control /home/david/.local/bin/kitty-bg toggle
