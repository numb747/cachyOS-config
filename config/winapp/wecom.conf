# winapp 应用配置：wecom（企业微信）
#
# 背景：企业微信公有云版没有 Linux 客户端。官网 platform=linux 接口返回的就是
# Windows exe；/server 页那个 Linux 包是私有部署版（weworklocal_*），公有云账号
# 登不上；也不存在员工聊天网页版。所以只能 wine。

WINEARCH=win64
# 实测：设 win10 时企业微信界面画得出来，但【整个交互层是死的】——鼠标点任何
# 位置都没反应。日志里 17 处 CEF/GPU 报错（vulkan 枚举失败、egl dri2 screen
# 创建失败）。企业微信 5.x 的界面由 CEF 渲染（libcef.dll 在
# WXWork/<版本>/compatible_web/ 下），CEF 初始化失败就是这个症状。
# 降到 win81 是社区验证过的解法。
#
# 注意别被表象带偏：窗口尺寸和虚拟桌面画布不一致【不是】点不动的原因，
# 安装器阶段两者同样不一致（1265x705 vs 1100x750）却能正常点击。
WIN_VERSION=win81
WINETRICKS="riched20 msvcp140"
EXE='C:\Program Files (x86)\WXWork\WXWork.exe'

SANDBOX=1
CJK=1

# 实测：不开虚拟桌面时，安装器会生成无标题的分层窗口，在 Hyprland 下反复
# 抢占置顶挡住真正的界面——手动拖开后一点击又立刻弹回来。开虚拟桌面后
# 所有窗口收进 wine 自管理的容器，这个问题消失。
# 刻意留空。虚拟桌面能把幽灵窗收编，但那是拿一个大容器糊住问题：多一层
# 容器窗口、画布尺寸要和窗口尺寸手工对齐、而且实测偶发启动崩溃。
# 幽灵窗改用窗口规则精确处理（见 ~/.config/hypr/config/windowrules.lua）。
VDESKTOP=""

# 保持默认（不强制软件渲染）。日志里确实有 vulkan 枚举失败、
# amdgpu_get_auth failed、egl dri2 screen 创建失败，但实测把 GPU 关掉
# 【并不能】消除那些空白的幽灵窗口，反而让主窗口更小（580x394 vs 672x801）。
# 那些 GPU 报错是噪音，不是病根，所以不留这条没用的设置。
GPU=1

# 企业微信是国产 IM，默认只给它看 XDG 文档目录就够收发文件了。
# ~/hacktools、~/myTestAndSecurity、~/Projects、~/ccconfig、~/.ssh 等
# 一律不放行——白名单制，不在列表里就是看不见。
EXTRA_BINDS=()
