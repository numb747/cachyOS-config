# 同一个应用「有窗口→窗口排第一；没窗口→原生应用排第一」。
#
# window_integration：应用条目回车时，若已有窗口就聚焦它而不是开新实例
#   （真要开新实例：Ctrl+Return）。更关键的是它是 score_open_windows 的前提——
#   源码里 hasWindow 只在这个开关打开时才计算，关着时下面那条完全不生效。
# score_open_windows（默认 true，这里写出来是为了说明）：有窗口的应用压分，
#   让 windows provider 给出的那条窗口排到它前面。
#   窗口条目没有历史加分，应用条目有，不压分的话常用应用永远压着自己的窗口。
#   上游是减半，会让无关条目夹进中间；本机装的是补丁版插件，应用分 = 窗口分 − 1，
#   紧贴在自己窗口下面（AUR 包 elephant-desktopapplications-windowfirst，见 cachyOS-config aur/README.md）。
window_integration = true
score_open_windows = true

# 2026-11-20：屏蔽系统自带的 localsend.desktop，换成 ~/.local/share/applications/localsend-xwayland.desktop
#   （强制 XWayland）。mesa 26.3.1 下 LocalSend 原生 Wayland 建不了 GL 上下文、窗口出不来，
#   见 docs/07。mesa 修好后删掉这条和那个 .desktop。
blacklist = [
  '^localsend$',
]

# （更早这里屏蔽过 Waydroid 导出的安卓版 LocalSend；Waydroid 已于 2026-11-17
#  整套卸载，见 docs/13 坑 7。更早还屏蔽过 wine 里的 Firefox 快捷方式，wine 已于 2026-10-09 卸载。）
