<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>mmd-view</title>
<style>
  :root { --font: Excalifont, Xiaolai, sans-serif; --bg:#1a1b26; --panel:#1f2335; --line:#292e42; --fg:#c0caf5; --mute:#565f89;
          --blue:#7aa2f7; --green:#9ece6a; --orange:#ff9e64; --yellow:#e0af68; --red:#f7768e; --purple:#bb9af7; }
  * { box-sizing: border-box; }
  /* 双击节点是「进入/跳源码」，不要浏览器顺手选中一个词（那个蓝色小方块）；报错信息留着可选，方便复制 */
  body { margin:0; height:100vh; display:flex; overflow:hidden; background:var(--bg); color:var(--fg);
         font-family: var(--font); user-select:none; }
  #err { user-select:text; }
  #side { width:230px; flex:none; overflow:auto; padding:14px 10px; background:var(--panel); border-right:1px solid var(--line); }
  #side.hide { display:none; }
  #side h1 { font-size:13px; font-weight:normal; color:var(--mute); margin:0 4px 10px; word-break:break-all; }
  #side a { display:block; padding:5px 8px; border-radius:6px; color:var(--fg); text-decoration:none; font-size:14px; word-break:break-all; }
  #side a:hover { background:var(--line); }
  #side a.cur { background:#2f334d; color:var(--blue); }
  #main { flex:1; position:relative; }
  #stage { position:absolute; inset:0; cursor:grab; }
  #stage.drag { cursor:grabbing; }
  #stage svg { width:100%; height:100%; display:block; }
  #bar { position:absolute; top:10px; left:12px; right:12px; display:flex; gap:12px; align-items:center; pointer-events:none; }
  #bar > * { pointer-events:auto; }
  #title { font-size:16px; color:var(--blue); }
  #q { background:var(--panel); border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:4px 8px;
       font:inherit; font-size:14px; width:200px; outline:none; }
  #q:focus { border-color:var(--blue); }
  #font { background:var(--panel); border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:3px 6px;
          font:inherit; font-size:13px; outline:none; cursor:pointer; }
  #font:focus { border-color:var(--blue); }
  #help { margin-left:auto; font-size:12px; color:var(--mute); text-align:right; }
  /* 信息卡：贴着选中节点浮出（位置由 placeCard 算），拖标题栏可钉住 */
  #info { position:absolute; left:0; top:0; width:480px; max-height:calc(100% - 70px); overflow:hidden auto; z-index:5;
          scrollbar-width:thin; scrollbar-color:#3b4261 transparent;
          padding:0 14px 12px; border-radius:10px; background:rgba(31,35,53,.97); border:1px solid #3b4261;
          box-shadow:0 8px 28px rgba(0,0,0,.45); font-size:20px; line-height:1.6; display:none; }
  #info .hd { position:sticky; top:0; z-index:1; display:flex; align-items:center; gap:6px; margin:0 -14px 6px;
              padding:8px 8px 6px 14px; background:#1f2335; border-bottom:1px solid var(--line); cursor:move; }
  #info .hd b { flex:1; color:var(--yellow); font-weight:normal; font-size:24px; }
  #info .hd button { margin:0; padding:0 10px; font-size:20px; }
  #info .up { color:var(--green); } #info .down { color:var(--orange); } #info .tip { color:var(--mute); font-size:16px; }
  #info .path { margin:4px 0 2px; color:var(--mute); font-size:14px; line-height:1.4; overflow-wrap:anywhere; user-select:text; }
  #info .warn { color:var(--orange); font-size:17px; }
  #info button { max-width:100%; overflow-wrap:anywhere; text-align:left; font:inherit; font-size:18px; background:#2f334d; color:var(--fg); border:1px solid var(--line);
                 border-radius:6px; padding:2px 9px; margin:4px 6px 0 0; cursor:pointer; }
  #info button:hover { border-color:var(--blue); }
  #info .notes { margin-top:8px; padding-top:6px; border-top:1px dashed var(--line); }
  #info .notes ul { margin:2px 0 4px; padding-left:18px; color:var(--yellow); user-select:text; }
  #err { position:absolute; left:12px; bottom:12px; max-width:60%; white-space:pre-wrap; font-family:monospace; font-size:12px;
         color:var(--red); background:var(--panel); border:1px solid var(--red); border-radius:8px; padding:10px; display:none; }
  #toast { position:absolute; left:50%; top:52px; transform:translateX(-50%); background:var(--panel); border:1px solid var(--line);
           border-radius:6px; padding:4px 12px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
  /* 高亮：选中=黄，上游（谁指向它）=绿，下游（它指向谁）=橙，搜索命中=紫 */
  /* 节点 .label-container 里第一条 path 是手绘斜线填充，其余是轮廓。发光只加在轮廓上，
     斜线淡下去 —— 整个节点加 drop-shadow 会让每根斜线都发光，压住文字 */
  .dim { opacity:.13; }
  :is(.hl-sel,.hl-up,.hl-down,.hl-match) .label-container > path:first-child { opacity:.25; }
  :is(.hl-sel,.hl-up,.hl-down,.hl-match) .label-container > path:not(:first-child) { stroke-width:2.4px !important; }
  .hl-sel .label-container > path:not(:first-child) { stroke:var(--yellow) !important; filter:drop-shadow(0 0 4px var(--yellow)); }
  .hl-up .label-container > path:not(:first-child) { stroke:var(--green) !important; filter:drop-shadow(0 0 4px var(--green)); }
  .hl-down .label-container > path:not(:first-child) { stroke:var(--orange) !important; filter:drop-shadow(0 0 4px var(--orange)); }
  .hl-match .label-container > path:not(:first-child) { stroke:var(--purple) !important; filter:drop-shadow(0 0 4px var(--purple)); }
  path.e-up { stroke:var(--green) !important; stroke-width:2.5px !important; }
  path.e-down { stroke:var(--orange) !important; stroke-width:2.5px !important; }
  .meta { cursor:pointer; }
  .note-dot { fill:var(--yellow); stroke:var(--bg); stroke-width:2px; }
  #info textarea { width:100%; min-height:124px; margin-top:6px; resize:none; user-select:text; font:inherit; font-size:20px;
                   background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; outline:none; }
  #info textarea:focus { border-color:var(--yellow); }
  #notesBtn { font:inherit; font-size:13px; background:var(--panel); color:var(--fg); border:1px solid var(--line);
              border-radius:6px; padding:3px 10px; cursor:pointer; }
  #notesBtn.has { color:var(--yellow); border-color:var(--yellow); }
</style>
</head>
<body>
<nav id="side"><h1 id="root"></h1><div id="list"></div></nav>
<div id="main">
  <div id="stage"></div>
  <div id="bar">
    <span id="title"></span>
    <input id="q" placeholder="/ 搜节点" autocomplete="off">
    <button id="notesBtn" title="整张图的备注（n）">本图备注</button>
    <select id="font" title="字体（t 切换）"><option value="cute">手写字体</option><option value="mono">等宽字体</option></select>
    <span id="help">滚轮缩放 · 拖动平移 · 点节点看上下游（再点一次展开整条链）· 双击跳源码 / 细节图<br>
      / 搜索 · n 备注 · t 字体 · f 适应窗口 · b 侧栏 · Esc 取消 · Alt+← 返回上一张图</span>
  </div>
  <div id="info"></div>
  <div id="err"></div>
  <div id="toast"></div>
</div>
<script src="/mermaid.js"></script>
<script>
const $ = s => document.querySelector(s);
const SVGNS = 'http://www.w3.org/2000/svg';
const stage = $('#stage');
let files = [], cur = null, seq = 0;
let svg = null, vb0 = null, view = null;
let meta = { src: {}, link: {}, notes: {} };
let nodes = new Map(), edges = [], labels = new Map();   // 节点 id → <g>；边 {start,end,el,label}
let sel = null, deep = false, matches = [], matchIdx = -1;

const toast = (msg, ms = 1800) => {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), ms);
};
const showErr = msg => { const e = $('#err'); e.textContent = msg; e.style.display = msg ? 'block' : 'none'; };

// 两套字体：手写（和 mmd 出的静态图一致）/ 等宽（照 kitty 里 LazyVim 的：英文 Adwaita Mono，中文回退到等距更纱黑体）
// 页面和图里的文字一起换；图要按新字体重新量字宽排版，所以切换时重画
const FONTS = {
  cute: 'Excalifont, Xiaolai, sans-serif',
  mono: '"Adwaita Mono", "Sarasa Mono SC", monospace',
};
let cfg = null, font = FONTS[localStorage.getItem('mmd-view.font')] ? localStorage.getItem('mmd-view.font') : 'cute';

async function setFont(key) {
  font = key; localStorage.setItem('mmd-view.font', key); $('#font').value = key;
  const family = FONTS[key];
  document.documentElement.style.setProperty('--font', family);
  await document.fonts.load(`16px ${family}`, '汉A').catch(() => {});   // 先把字体备好，mermaid 量字宽才准
  mermaid.initialize({ startOnLoad: false, securityLevel: 'loose', ...cfg, fontFamily: family,
                       themeVariables: { ...cfg.themeVariables, fontFamily: family } });
  if (cur) await show(cur, true);
}

async function init() {
  cfg = await (await fetch('/config.json')).json();
  await setFont(font);
  await loadList();
  addEventListener('hashchange', route);
  const es = new EventSource('/api/events');
  es.onmessage = ev => {
    const f = JSON.parse(ev.data);
    if (f === '\0list') loadList();
    else if (f === cur) show(cur, true).then(ok => ok && toast('已刷新：' + cur));
  };
  route();
}

async function loadList() {
  const r = await (await fetch('/api/files')).json();
  files = r.files;
  $('#root').textContent = r.root.replace(/^\/home\/[^/]+/, '~');
  $('#list').innerHTML = '';
  for (const f of files) {
    const a = document.createElement('a');
    a.href = '#f=' + encodeURIComponent(f); a.textContent = f.replace(/\.(mmd|mermaid)$/, '');
    if (f === cur) a.className = 'cur';
    $('#list').append(a);
  }
  if (files.length <= 1) $('#side').classList.add('hide');
}

function route() {
  const f = new URLSearchParams(location.hash.slice(1)).get('f') || files[0];
  if (f) show(f, false); else showErr('这个目录下没有 .mmd 文件');
}

function parseMeta(text) {
  const m = { src: {}, link: {}, notes: {} };
  for (const line of text.split('\n')) {
    const n = line.match(/^\s*%%\s*@note\s+(\S+)\s+(.*\S)/);
    if (n) { (m.notes[n[1]] ||= []).push(n[2]); continue; }
    // @src <id> <路径> <锚点文字…>（推荐，代码挪动不会指错）或 @src <id> <路径>:<行号>
    const r = line.match(/^\s*%%\s*@(src|link)\s+(\S+)\s+(\S+)(?:\s+(.*\S))?/);
    if (!r) continue;
    if (r[1] === 'src') {
      const s = r[3].match(/^(.*?)(?::(\d+))?$/);
      m.src[r[2]] = { path: s[1], line: s[2] || '', anchor: r[4] || '' };
    } else m.link[r[2]] = r[3];
  }
  return m;
}

async function show(f, keepView) {
  const same = f === cur;
  const res = await fetch('/api/src?f=' + encodeURIComponent(f));
  if (!res.ok) return showErr('打不开：' + f);
  const text = await res.text();
  const id = 'mmd' + (++seq);
  let out;
  try {
    out = await mermaid.render(id, text);
  } catch (e) {
    document.getElementById('d' + id)?.remove(); document.getElementById(id)?.remove();
    return showErr(f + '\n' + (e.message || e));   // 语法错：留着上一版图，只报错
  }
  showErr('');
  cur = f;
  document.title = f + ' — mmd-view';
  $('#title').textContent = f;
  for (const a of document.querySelectorAll('#list a')) a.classList.toggle('cur', a.getAttribute('href') === '#f=' + encodeURIComponent(f));
  stage.innerHTML = out.svg;
  out.bindFunctions?.(stage);
  svg = stage.querySelector('svg');
  svg.removeAttribute('style'); svg.removeAttribute('width'); svg.removeAttribute('height');
  const b = svg.viewBox.baseVal, pad = 30;
  vb0 = { x: b.x - pad, y: b.y - pad, w: b.width + 2 * pad, h: b.height + 2 * pad };
  if (!(keepView && same && view)) view = { ...vb0 };
  apply();
  meta = parseMeta(text);
  const dn = meta.notes['*'];
  $('#notesBtn').classList.toggle('has', !!dn);
  $('#notesBtn').textContent = dn ? `本图备注 ${dn.length}` : '本图备注';
  await buildGraph(text, id);
  if (!same) card.pinned = null;
  if (same && sel && nodes.has(sel)) highlight();
  else if (same && card.id === '*') renderCard();
  else clearSel();
  return true;
}

// 只有流程图能拿到边的起止：从 Mermaid 的解析结果取，再按 id 对回 SVG 元素
async function buildGraph(text, id) {
  nodes = new Map(); edges = []; labels = new Map();
  let d;
  try { d = await mermaid.mermaidAPI.getDiagramFromText(text); } catch { return; }
  if (!d.db?.getEdges || !d.db?.getVertices) return;
  const re = new RegExp('^' + id + '-flowchart-(.+)-\\d+$');
  for (const g of svg.querySelectorAll('g[id]')) {
    const m = g.id.match(re);
    if (m) nodes.set(m[1], g);
  }
  for (const [k, v] of d.db.getVertices()) labels.set(k, (v.text || k).replace(/<[^>]+>/g, ' ').trim());
  for (const e of d.db.getEdges()) {
    const el = svg.querySelector(`path[data-id="${CSS.escape(e.id)}"]`);
    const label = svg.querySelector(`g.label[data-id="${CSS.escape(e.id)}"]`)?.closest('.edgeLabel');
    edges.push({ start: e.start, end: e.end, el, label });
  }
  for (const [n, g] of nodes) {
    const s = meta.src[n], l = meta.link[n], notes = meta.notes[n];
    if (!s && !l && !notes) continue;
    if (s || l) g.classList.add('meta');
    const t = document.createElementNS(SVGNS, 'title');
    t.textContent = [l && '双击进入：' + l, s && srcText(s), notes && '备注：' + notes.join(' / ')].filter(Boolean).join('\n');
    g.prepend(t);
    if (notes) {
      const b = (g.querySelector('.label-container') || g).getBBox();
      const dot = document.createElementNS(SVGNS, 'circle');
      dot.setAttribute('class', 'note-dot'); dot.setAttribute('r', 6);
      dot.setAttribute('cx', b.x + b.width - 2); dot.setAttribute('cy', b.y + 2);
      g.append(dot);
    }
  }
}

function reach(from, dir) {   // dir: 'down' 沿边方向，'up' 逆向；deep=false 只走一步
  const seen = new Set(), queue = [from];
  while (queue.length) {
    const n = queue.shift();
    for (const e of edges) {
      const [a, b] = dir === 'down' ? [e.start, e.end] : [e.end, e.start];
      if (a === n && !seen.has(b) && b !== from) { seen.add(b); if (deep) queue.push(b); }
    }
  }
  return seen;
}

function resetClasses() {
  for (const g of nodes.values()) g.classList.remove('dim', 'hl-sel', 'hl-up', 'hl-down', 'hl-match');
  for (const e of edges) {
    for (const x of [e.el, e.label]) x?.classList.remove('dim', 'e-up', 'e-down');
  }
}

function highlight() {
  resetClasses();
  const up = reach(sel, 'up'), down = reach(sel, 'down');
  for (const [n, g] of nodes) {
    if (n === sel) g.classList.add('hl-sel');
    else if (up.has(n)) g.classList.add('hl-up');
    else if (down.has(n)) g.classList.add('hl-down');
    else g.classList.add('dim');
  }
  for (const e of edges) {
    let cls = null;
    if (deep) {
      if ((e.start === sel || down.has(e.start)) && down.has(e.end)) cls = 'e-down';
      else if ((e.end === sel || up.has(e.end)) && up.has(e.start)) cls = 'e-up';
    } else {
      if (e.start === sel && down.has(e.end)) cls = 'e-down';
      else if (e.end === sel && up.has(e.start)) cls = 'e-up';
    }
    if (cls) e.el?.classList.add(cls); else { e.el?.classList.add('dim'); e.label?.classList.add('dim'); }
  }
  card.up = up; card.down = down;
  renderCard();
}

// —— 信息卡：贴着选中节点浮出，挑不压住高亮节点的一侧；跟着平移缩放走；拖标题栏钉住 ——
// id：节点 id 或 '*'（整张图）；side：当前贴在节点哪一侧；pinned：拖过之后的固定位置（换图才清）；open：备注是否在编辑
const info = $('#info');
const card = { id: null, side: null, pinned: null, open: false, up: new Set(), down: new Set() };
// 没保存的备注：`文件|id` → { text, base }（base = 开始编辑时文件里的备注）。刷新、切走节点都不丢
const drafts = {};
const draftKey = id => cur + '|' + id;
const esc = x => x.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const name = n => labels.get(n) || n;
const button = (text, onclick, title) => {
  const b = document.createElement('button'); b.textContent = text; b.onclick = onclick; if (title) b.title = title; return b;
};

function openCard(id) {
  card.id = id; card.side = null; card.open = id === '*' || !!drafts[draftKey(id)];
}

function renderCard() {
  const id = card.id;
  if (!id) return;
  // 重建前记下光标，刷新后放回去 —— 写到一半文件被外面改了也不打断
  const old = info.querySelector('textarea');
  const caret = old && document.activeElement === old ? [old.selectionStart, old.selectionEnd] : null;
  info.innerHTML = '';
  const add = (html, cls) => { const d = document.createElement('div'); if (cls) d.className = cls; d.innerHTML = html; info.append(d); return d; };
  const hd = add(`<b>${esc(id === '*' ? '本图备注' : name(id))}</b>`, 'hd');
  if (card.pinned) hd.append(button('↺', () => { card.pinned = null; card.side = null; renderCard(); }, '回到节点旁'));
  hd.append(button('×', clearSel, '关闭（Esc）'));
  hd.title = '拖动可固定在别处';
  hd.onmousedown = dragCard;
  if (id !== '*') {
    const s = meta.src[id], l = meta.link[id];
    add(`↑ 上游 ${card.up.size}：${[...card.up].map(n => esc(name(n))).join('、') || '无'}`, 'up');
    add(`↓ 下游 ${card.down.size}：${[...card.down].map(n => esc(name(n))).join('、') || '无'}`, 'down');
    const btns = add('');
    // 按钮上只放文件名和锚点，长路径另起一行小字（可选中复制），免得撑破卡片
    if (s) btns.append(button('在 nvim 打开 ' + s.path.split('/').pop() + (s.anchor ? ' · ' + s.anchor : s.line ? ':' + s.line : ''),
                              () => openSrc(id), srcText(s)));
    if (l) btns.append(button('进入细节图 ' + l, () => follow(id)));
    if (s?.path.includes('/')) add(esc(s.path), 'path');
    add(deep ? '已展开整条链 · 再点一次收回' : '再点一次：展开整条调用链', 'tip');
  }
  const notes = notesBox(id);
  info.append(notes);
  info.style.display = 'block';
  notes.grow?.();
  placeCard(!caret);
  const ta = info.querySelector('textarea');
  if (caret && ta) { ta.focus(); ta.setSelectionRange(...caret); }
}

// 备注：一行一条，存进 .mmd 的 `%% @note <id|*> …`；id 为 * 是整张图的备注。arch-map 更新时会读、不会删
// 平时只列出已有备注，点「写备注」或按 n 才展开输入框
function notesBox(id) {
  const box = document.createElement('div'); box.className = 'notes';
  const list = meta.notes[id] || [], saved = list.join('\n'), key = draftKey(id), d = drafts[key];
  if (!card.open) {
    if (list.length) { const ul = document.createElement('ul'); ul.innerHTML = list.map(t => `<li>${esc(t)}</li>`).join(''); box.append(ul); }
    if (d) box.append(Object.assign(document.createElement('div'), { className: 'warn', textContent: '有一份没保存的草稿' }));
    box.append(button(list.length || d ? '编辑备注（n）' : '写备注（n）', openNotes));
    return box;
  }
  if (d && d.base !== saved) {
    const w = Object.assign(document.createElement('div'), { className: 'warn', textContent: '文件里的备注在你编辑时被改过，保存会用下面这份覆盖 ' });
    w.append(button('改用文件里的', () => { delete drafts[key]; renderCard(); }));
    box.append(w);
  }
  const ta = document.createElement('textarea');
  ta.value = d ? d.text : saved;
  ta.placeholder = (id === '*' ? '整张图' : '这个节点') + '的备注 / 新需求，一行一条 · Ctrl+Enter 保存 · Esc 收起';
  const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight + 2, 320) + 'px'; };
  ta.addEventListener('input', () => {
    if (ta.value === saved) delete drafts[key];
    else (drafts[key] ??= { base: saved }).text = ta.value;
    grow(); placeCard(false);
  });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); saveNote(id, ta.value); }
    if (e.key === 'Escape') { e.stopPropagation(); if (id === '*') clearSel(); else { card.open = false; renderCard(); } }
  });
  box.append(ta, button('保存（Ctrl+Enter）', () => saveNote(id, ta.value)));
  if (id !== '*') box.append(button('收起', () => { card.open = false; renderCard(); }));
  box.grow = grow;
  return box;
}

function openNotes() {
  if (!card.id) return showDiagramNotes();
  card.open = true; renderCard();
  const ta = info.querySelector('textarea');
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}

async function saveNote(id, text) {
  const r = await fetch('/api/note', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                       body: JSON.stringify({ f: cur, id, text }) });
  if (!r.ok) return toast(await r.text());
  delete drafts[draftKey(id)];
  const lines = text.split('\n').map(t => t.trim()).filter(Boolean);
  if (lines.length) meta.notes[id] = lines; else delete meta.notes[id];
  if (card.id === id) {
    if (id === '*') clearSel(); else { card.open = false; renderCard(); }
  }
  toast('备注已保存');
}

function showDiagramNotes() {
  clearSel();
  openCard('*'); renderCard();
  const ta = info.querySelector('textarea');
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}

const rel = (r, S) => ({ left: r.left - S.left, top: r.top - S.top, right: r.right - S.left, bottom: r.bottom - S.top,
                         width: r.width, height: r.height });
const overlap = (a, x, y, w, h) =>
  Math.max(0, Math.min(a.right, x + w) - Math.max(a.left, x)) * Math.max(0, Math.min(a.bottom, y + h) - Math.max(a.top, y));

// rechoose=false 时保持上次那一侧（平移缩放、输入时不换边，免得卡片乱跳），除非那一侧压住了选中节点
function placeCard(rechoose = true) {
  if (info.style.display !== 'block' || !card.id) return;
  const S = stage.getBoundingClientRect(), w = info.offsetWidth, h = info.offsetHeight, m = 10;
  const top = $('#bar').getBoundingClientRect().bottom - S.top + 6;
  const fit = (x, y) => [Math.max(m, Math.min(S.width - w - m, x)), Math.max(top, Math.min(S.height - h - m, y))];
  const put = ([x, y]) => { info.style.left = x + 'px'; info.style.top = y + 'px'; };
  info.style.visibility = '';
  if (card.pinned) return put(fit(card.pinned.x, card.pinned.y));
  if (card.id === '*') { const b = rel($('#notesBtn').getBoundingClientRect(), S); return put(fit(b.left, b.bottom + 8)); }
  const g = nodes.get(card.id);
  if (!g?.isConnected) return;
  const r = rel(g.getBoundingClientRect(), S);
  const editing = info.contains(document.activeElement);
  // 节点移出视野就收起，正在写备注时除外
  if (!editing && (r.right < 0 || r.left > S.width || r.bottom < 0 || r.top > S.height)) { info.style.visibility = 'hidden'; return; }

  // 要躲开的：选中节点（压住它代价最大）、高亮的上下游节点和边标签
  const pad = 6, self = { left: r.left - pad, top: r.top - pad, right: r.right + pad, bottom: r.bottom + pad };
  const avoid = [[self, 50]];
  for (const [n, el] of nodes) if (el.classList.contains('hl-up') || el.classList.contains('hl-down')) avoid.push([rel(el.getBoundingClientRect(), S), 1]);
  for (const e of edges) if (e.label && !e.label.classList.contains('dim')) avoid.push([rel(e.label.getBoundingClientRect(), S), 0.5]);

  const gap = 14, cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const spots = [['r', r.right + gap, cy - h / 2], ['r-t', r.right + gap, r.top], ['r-b', r.right + gap, r.bottom - h],
                 ['b', cx - w / 2, r.bottom + gap], ['l', r.left - gap - w, cy - h / 2], ['l-t', r.left - gap - w, r.top],
                 ['l-b', r.left - gap - w, r.bottom - h], ['t', cx - w / 2, r.top - gap - h]]
    .map(([side, x, y], i) => {
      const [fx, fy] = fit(x, y);
      const cost = avoid.reduce((sum, [a, k]) => sum + overlap(a, fx, fy, w, h) * k, 0) + i;   // + i：同样好时按顺序偏好右侧
      return { side, x: fx, y: fy, cost, hitsSelf: overlap(self, fx, fy, w, h) > 0 };
    });
  let pick = !(rechoose && !editing) && spots.find(s => s.side === card.side);
  if (!pick || pick.hitsSelf) pick = spots.reduce((a, b) => (b.cost < a.cost ? b : a));
  card.side = pick.side;
  put([pick.x, pick.y]);
}

function dragCard(e) {
  if (e.button !== 0 || e.target.closest('button')) return;
  e.preventDefault();   // 不抢输入框的焦点
  const S = stage.getBoundingClientRect(), r = info.getBoundingClientRect();
  const dx = e.clientX - r.left, dy = e.clientY - r.top, wasPinned = !!card.pinned;
  const move = ev => { card.pinned = { x: ev.clientX - S.left - dx, y: ev.clientY - S.top - dy }; placeCard(false); };
  const up = () => {
    removeEventListener('mousemove', move); removeEventListener('mouseup', up);
    if (card.pinned && !wasPinned) renderCard();   // 刚钉住：标题栏补上 ↺
  };
  addEventListener('mousemove', move); addEventListener('mouseup', up);
}

const srcText = s => s.path + (s.anchor ? ' · ' + s.anchor : s.line ? ':' + s.line : '');

function clearSel() { sel = null; deep = false; card.id = null; card.open = false; resetClasses(); info.style.display = 'none'; }

async function openSrc(n) {
  const s = meta.src[n]; if (!s) return;
  const r = await fetch(`/api/open?f=${encodeURIComponent(s.path)}&l=${s.line}&a=${encodeURIComponent(s.anchor)}`);
  toast(await r.text(), 2500);
}

function follow(n) {
  const l = meta.link[n]; if (!l) return;
  const parts = cur.split('/').slice(0, -1);
  for (const p of l.split('/')) { if (p === '..') parts.pop(); else if (p !== '.') parts.push(p); }
  location.hash = '#f=' + encodeURIComponent(parts.join('/'));
}

// —— 视图：直接改 viewBox，任何缩放倍数下文字都是矢量清晰的 ——
function apply() { svg?.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`); placeCard(false); }
function toSvg(cx, cy) { const p = svg.createSVGPoint(); p.x = cx; p.y = cy; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function zoomAt(cx, cy, f) {
  const p = toSvg(cx, cy);
  view.x = p.x - (p.x - view.x) * f; view.y = p.y - (p.y - view.y) * f; view.w *= f; view.h *= f; apply();
}
function center(g) {
  const b = g.getBBox(), m = svg.getScreenCTM().inverse().multiply(g.getScreenCTM());
  const p = svg.createSVGPoint(); p.x = b.x + b.width / 2; p.y = b.y + b.height / 2;
  const c = p.matrixTransform(m);
  view.x = c.x - view.w / 2; view.y = c.y - view.h / 2; apply();
}

stage.addEventListener('wheel', e => { if (!svg) return; e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(e.deltaY * 0.0015)); }, { passive: false });

let drag = null, moved = false;
stage.addEventListener('mousedown', e => { if (e.button === 0 && svg) { drag = { x: e.clientX, y: e.clientY }; moved = false; } });
addEventListener('mousemove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 3) { moved = true; stage.classList.add('drag'); }
  const k = svg.getScreenCTM().a;
  view.x -= dx / k; view.y -= dy / k; drag = { x: e.clientX, y: e.clientY }; apply();
});
addEventListener('mouseup', () => { drag = null; stage.classList.remove('drag'); });

const nodeOf = t => { for (const [n, g] of nodes) if (g.contains(t)) return n; return null; };
stage.addEventListener('click', e => {
  if (moved) return;
  const n = nodeOf(e.target);
  if (!n) return clearSel();
  if (n === sel) deep = !deep; else { sel = n; deep = false; openCard(n); }
  highlight();
});
stage.addEventListener('dblclick', e => {
  const n = nodeOf(e.target); if (!n) return;
  if (meta.link[n]) follow(n); else if (meta.src[n]) openSrc(n); else toast('这个节点没有标 @src / @link');
});

// —— 搜索 ——
$('#q').addEventListener('input', () => {
  const q = $('#q').value.trim().toLowerCase();
  clearSel(); matches = []; matchIdx = -1;
  if (!q) return;
  for (const [n, g] of nodes) {
    const hit = (labels.get(n) || n).toLowerCase().includes(q) || n.toLowerCase().includes(q);
    g.classList.add(hit ? 'hl-match' : 'dim');
    if (hit) matches.push(g);
  }
  for (const e of edges) { e.el?.classList.add('dim'); e.label?.classList.add('dim'); }
});
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && matches.length) { matchIdx = (matchIdx + 1) % matches.length; center(matches[matchIdx]); toast(`${matchIdx + 1} / ${matches.length}`); }
  if (e.key === 'Escape') { $('#q').value = ''; $('#q').dispatchEvent(new Event('input')); $('#q').blur(); }
});

addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) || e.ctrlKey || e.altKey || e.metaKey) return;
  const r = stage.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  if (e.key === 'f' || e.key === '0') { view = { ...vb0 }; apply(); }
  else if (e.key === '+' || e.key === '=') zoomAt(cx, cy, 0.8);
  else if (e.key === '-') zoomAt(cx, cy, 1.25);
  else if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  else if (e.key === 'b') $('#side').classList.toggle('hide');
  else if (e.key === 't') setFont(font === 'cute' ? 'mono' : 'cute');
  else if (e.key === 'n') { e.preventDefault(); openNotes(); }
  else if (e.key === 'Escape') clearSel();
});
addEventListener('resize', apply);
$('#font').onchange = () => { setFont($('#font').value); $('#font').blur(); };
$('#notesBtn').onclick = () => (card.id === '*' ? clearSel() : showDiagramNotes());

init();
</script>
</body>
</html>
