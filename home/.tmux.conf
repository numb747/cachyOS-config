# tmux 3.8 —— 说明见 ~/cachyOS-config/docs/14-tmux.md
# 思路学 Zellij：常用操作全是 Alt 单键，免前缀；前缀 C-q 只当备用。
# Alt 键避开了 Hyprland 占用的：9 [ ] T S W E G Z Tab Space Enter（及其 Shift 版）；Alt+\ 原属 Hyprland，已让给 tmux
set -g mouse on            # 3.8 起本来就默认 on，写明是为了旧版本也一致
setw -g mode-keys vi       # 不写也会是 vi（tmux 看 $EDITOR 里有没有 vi），写明不靠猜
set -g history-limit 50000 # 默认 2000 行，capture-pane 抓长输出（比如 Claude 的回答）不够用

# 复制同时走 OSC52 和 wl-copy，确保进系统剪贴板
# （本机终端链是 kitty → nvim :terminal → tmux，OSC52 要过 nvim 一层，wl-copy 是直达的兜底）
set -s set-clipboard on
set -s copy-command 'wl-copy'

# vim 习惯：v 开始选择，C-v 切换块选择，y 复制并退出
# （vi 模式的默认绑定里 v 是块选择、y 没绑定 —— 「复制不出来」就是这个）
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# ---- 基础
set -g prefix C-q          # 备用前缀；C-b 还给 Claude Code（它的「命令转后台」）
unbind C-b
bind C-q send-prefix
set -g base-index 1        # 编号和键盘数字一致
setw -g pane-base-index 1
set -g renumber-windows on # 关掉中间的标签自动补位
set -g focus-events on
# 外层是 nvim 终端（报 xterm-256color），支持真彩色。写固定下标 9（默认只占 0-2），前缀 r 重载不会重复追加
set -s terminal-features[9] 'xterm-256color:RGB'

# ======================= Alt 层（免前缀） =======================
# ---- 窗格
# Alt+n 新建窗格：宽 > 高×2 就左右分，否则上下分（字符约 1:2，近似 Zellij 的自动方向）
bind -n M-n if -F '#{e|>:#{pane_width},#{e|*:#{pane_height},2}}' \
  { split-window -h -c '#{pane_current_path}' } { split-window -v -c '#{pane_current_path}' }
# Alt+h/l 切窗格，到最左/最右边时穿越到上/下一个标签
# （只有一个标签/会话时到边就停住，不然状态栏会报 No previous window）
bind -n M-h if -F '#{pane_at_left}'   { if -F '#{>:#{session_windows},1}' { previous-window } } { select-pane -L }
bind -n M-l if -F '#{pane_at_right}'  { if -F '#{>:#{session_windows},1}' { next-window } }     { select-pane -R }
# Alt+k/j 切窗格，到最上/最下边时穿越到上/下一个会话
bind -n M-k if -F '#{pane_at_top}'    { if -F '#{>:#{server_sessions},1}' { switch-client -p } } { select-pane -U }
bind -n M-j if -F '#{pane_at_bottom}' { if -F '#{>:#{server_sessions},1}' { switch-client -n } } { select-pane -D }
# Alt+\ 左右分（竖线一刀）、Alt+- 上下分（横线一刀）。不用 Alt+Shift+\ 区分方向：
# 外层 nvim 转发「Alt+Shift+标点」会丢掉 Shift，tmux 收到的还是同一个键（注释行别以反斜杠结尾，会续行）
bind -n 'M-\' split-window -h -c '#{pane_current_path}'
bind -n M-- split-window -v -c '#{pane_current_path}'
bind -n M-m resize-pane -Z                                  # 放大/还原
bind -n M-f if -F '#{pane_floating_flag}' { join-pane } { break-pane -W }   # 浮动/放回（3.8）

# ---- 标签
bind -n M-N new-window -c '#{pane_current_path}'
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
# 改名：输入框留空直接写新名（不预填旧名），旧名显示在提示里；直接回车 = 不改
bind -n M-r command-prompt -p '标签名（原 #W）:' { if -F '#{!=:%%,}' { rename-window '%%' } }
# Alt+q 关标签：只有一个窗格时直接关；多个窗格（比如 Agent Teams 的队长 + 队员）先确认
bind -n M-q if -F '#{>:#{window_panes},1}' \
  { confirm-before -p '关闭整个标签（#{window_panes} 个窗格）？(y/n)' kill-window } { kill-window }
set -g detach-on-destroy off            # 关掉会话的最后一个标签时切到别的会话，而不是整个脱离

# ---- 会话
bind -n M-o choose-tree -Zs          # 等同原来的 前缀 s：会话列表（标签收起，→ 展开），回车直达
bind -n M-O display-popup -E -w 70% -h 60% -b rounded -T ' 打开项目 ' "~/.local/bin/tmux-proj"
bind -n M-R command-prompt -p '会话名（原 #S）:' { if -F '#{!=:%%,}' { rename-session '%%' } }
bind -n M-d detach-client

# ---- 其他
bind -n M-v copy-mode
bind -n M-\; command-prompt
# Alt+0 锁定：Alt 层和前缀全部放行给里面的程序（ssh 进去的远端 tmux、偶尔要用的 Claude Alt 键）
bind -n M-0 { set prefix None; set key-table off; refresh-client -S }
bind -T off M-0 { set -u prefix; set -u key-table; refresh-client -S }
# Alt+/ 速查菜单：列出所有 Alt 键，选中即执行
# （不用 Alt+?：外层 nvim 转发「Alt+Shift+标点」会丢掉 Shift，按 Alt+? 到 tmux 是 Alt+/。字母不受影响）
# 每项用 send-keys -K 触发真正的绑定，改上面的键不用再改这里
bind -n M-/ display-menu -b rounded -T '#[align=centre] Alt 键速查 ' -x C -y C \
  '左右分屏            Alt+\'  '\' { send-keys -K 'M-\' } \
  '上下分屏            Alt+-'  - { send-keys -K M-- } \
  '自动分屏            Alt+n'  n { send-keys -K M-n } \
  '新建标签            Alt+N'  N { send-keys -K M-N } \
  '' \
  '切窗格/穿越标签     Alt+h/l' '' '' \
  '切窗格/穿越会话     Alt+j/k' '' '' \
  '直达标签            Alt+1-8' '' '' \
  '' \
  '全屏/还原窗格       Alt+m'  m { send-keys -K M-m } \
  '浮动/放回           Alt+f'  f { send-keys -K M-f } \
  '关闭标签            Alt+q'  q { send-keys -K M-q } \
  '标签改名            Alt+r'  r { send-keys -K M-r } \
  '' \
  '会话列表            Alt+o'  o { send-keys -K M-o } \
  '打开项目            Alt+O'  O { send-keys -K M-O } \
  '会话改名            Alt+R'  R { send-keys -K M-R } \
  '脱离                Alt+d'  d { send-keys -K M-d } \
  '' \
  '复制模式            Alt+v'  v { send-keys -K M-v } \
  '命令行              Alt+; '  '\;' { command-prompt } \
  '锁定/解锁           Alt+0'  0 { send-keys -K M-0 }

# ---- 前缀表（备用）
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind r source-file ~/.tmux.conf \; display '已重载 ~/.tmux.conf'

# ======================= 外观（tokyonight，取自 noctalia 生成的 kitty 配色） =======================
# 风格学 catppuccin/tmux 的 rounded 与 tmux-powerkit：每块都是「彩色图标头 + 暗色正文」的圆角胶囊。
# 底色透明跟 kitty 走（毛玻璃透得过来）；胶囊用 Nerd Font 圆角  
#   主色 #7a88cf  青 #7bb0c0  品红 #d7729f  黄 #e6c384  绿 #9cd58a  红 #f7768e
#   胶囊正文底 #2c314a（当前）/ #292e42（其余）  深字 #1f2335
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=default,fg=#545c7e'
set -g status-interval 5               # 右侧 git 分支的刷新间隔
set -g status-left-length 60
set -g status-right-length 150

# 状态栏上方空一行，像浮起来的 bar：默认的第 0 行格式挪到第 1 行，第 0 行留空。
# 先 -u 复原默认值再挪，前缀 r 重载时不会把空行挪下去
set -g status 2
run-shell 'tmux set -gu status-format; tmux set -g "status-format[1]" "$(tmux show -gv "status-format[0]")"; tmux set -g "status-format[0]" ""'

# 左：会话胶囊。图标头平时蓝 、按了前缀黄 、复制模式绿 、锁定红  LOCK
set -g status-left "#{?#{==:#{client_key_table},off},#[fg=#f7768e]#[bg=#f7768e#,fg=#1f2335#,bold] LOCK ,#{?client_prefix,#[fg=#e6c384]#[bg=#e6c384#,fg=#1f2335#,bold] ,#{?pane_in_mode,#[fg=#9cd58a]#[bg=#9cd58a#,fg=#1f2335#,bold] ,#[fg=#7a88cf]#[bg=#7a88cf#,fg=#1f2335#,bold] }}}#[bg=#2c314a,fg=#c0caf5,bold] #S #[bg=default,fg=#2c314a,nobold] "

# 标签：全部做成胶囊。当前的亮（蓝头），其余暗（灰头）；放大了显示 󰊓，有新输出编号变黄、响铃变红
# ⚠ 3.8 的默认值 current-style=underscore、activity/bell-style=reverse 会叠在胶囊上
#   （当前标签多一条下划线、有新输出的整块反色），全清成 default，提醒交给下面的编号颜色
setw -g window-status-current-style default
setw -g window-status-activity-style default
setw -g window-status-bell-style default
setw -g window-status-separator ''
setw -g window-status-format "#[fg=#3b4261]#[bg=#3b4261,fg=#{?window_bell_flag,#f7768e,#{?window_activity_flag,#e6c384,#8289a6}}]#I #[bg=#292e42,fg=#737aa2] #W#{?window_zoomed_flag, 󰊓,} #[bg=default,fg=#292e42] "
setw -g window-status-current-format "#[fg=#7a88cf]#[bg=#7a88cf,fg=#1f2335,bold]#I #[bg=#2c314a,fg=#c0caf5,bold] #W#{?window_zoomed_flag,#[fg=#7bb0c0] 󰊓,} #[bg=default,fg=#2c314a,nobold] "

# 右：会话圆点（Alt+j/k 穿越时看在第几个）→ 目录 → git 分支（不在仓库里就不显示）→ 帮助
set -g status-right "\
#{S:#{?#{==:#{session_name},#{client_session}},#[fg=#7a88cf]●,#[fg=#545c7e]○} } \
#[fg=#7bb0c0]#[bg=#7bb0c0,fg=#1f2335] #[bg=#2c314a,fg=#a9b1d6] #{=/-28/…:#{s|^/home/[^/]+|~|:pane_current_path}} #[bg=default,fg=#2c314a] \
#{?#{!=:#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null),},#[fg=#d7729f]#[bg=#d7729f#,fg=#1f2335] #[bg=#2c314a#,fg=#a9b1d6] #(git -C '#{pane_current_path}' branch --show-current 2>/dev/null) #[bg=default#,fg=#2c314a] ,}\
#[fg=#545c7e]󰋖 Alt+/ "
setw -g monitor-activity on
set -g visual-activity off

# 窗格边框：顶部标题。当前窗格的标题也是胶囊（Agent Teams 时就是任务名；没设标题就显示在跑的程序）
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-style 'fg=#2c314a'
set -g pane-active-border-style 'fg=#7a88cf'
set -g pane-border-format "#{?pane_active,#[fg=#7a88cf]#[bg=#7a88cf#,fg=#1f2335#,bold] #{?#{==:#{pane_title},#{host}},#{pane_current_command},#{pane_title}} #[bg=default#,fg=#7a88cf#,nobold],#[fg=#545c7e] #{?#{==:#{pane_title},#{host}},#{pane_current_command},#{pane_title}} }"

# 弹窗、菜单、提示、复制选区
set -g popup-border-lines rounded
set -g popup-border-style 'fg=#7a88cf'
set -g menu-border-lines rounded
set -g menu-style 'bg=#1f2335,fg=#a9b1d6'
set -g menu-selected-style 'bg=#7a88cf,fg=#1f2335,bold'
set -g menu-border-style 'fg=#7a88cf'
set -g message-style 'bg=#2c314a,fg=#c0caf5'
set -g message-command-style 'bg=#2c314a,fg=#c0caf5'
setw -g mode-style 'bg=#4b517a,fg=#c0caf5'
setw -g clock-mode-colour '#7a88cf'
