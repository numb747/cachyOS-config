# tmux 3.8 —— 说明见 ~/cachyOS-config/docs/14-tmux.md
set -g mouse on            # 3.8 起本来就默认 on，写明是为了旧版本也一致
setw -g mode-keys vi       # 不写也会是 vi（tmux 看 $EDITOR 里有没有 vi），写明不靠猜
set -g history-limit 50000 # 默认 2000 行，capture-pane 抓长输出（比如 Claude 的回答）不够用

# 复制同时走 OSC52 和 wl-copy，确保进系统剪贴板
# （本机终端链是 kitty → nvim :terminal → tmux，OSC52 要过 nvim 一层，wl-copy 是直达的兜底）
set -s set-clipboard on
set -s copy-command 'wl-copy'

# vim 习惯：v 开始选择，C-v 切换块选择，y 复制并退出
# （vi 模式的默认绑定里 v 是块选择、y 没绑定 —— 「复制不出来」就是这个）
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
