<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!--
    汉字字形优先级修正
    ==================
    问题：系统 sans-serif 的 CJK 回退第一顺位是 Noto Sans CJK *KR*（韩文字形），
          「直 / 骨 / 查 / 兌」等字的写法与简中习惯不同，看久了别扭。
          根因是 /etc/fonts/conf.d/65-nonlatin.conf 按字母序列出 Noto CJK 家族，KR 排在 SC 前。

    做法：分三层，全部用 <match> 写。
          第一层 —— 钉住 Latin 字体（英文/数字观感完全不变），CJK 紧跟其后，
                    这样英文走 Latin 字体、汉字逐字回退到更纱 / Noto SC。
          第二层 —— 对明确标了 lang=zh-cn 的文本，把中文字体顶到最前。
          第三层 —— 对 lang=ja/ko/zh-tw/zh-hk，把各自的区域字体顶回去，
                    否则会被第一层钉住的简中字形抢走。
          ★ 三个顺序陷阱：
            1. mode="prepend" 是插到「匹配到的那一项之前」，不是队首；
               要顶到第一位得用 mode="prepend_first"。
            2. <match> 按文档顺序依次执行，写在后面的层能盖住前面的层。
            3. 不要用 <alias>/<prefer> —— 它无论写在文件哪个位置都会被排到所有 <match> 之前。

    兜底：链里没安装的字体 fontconfig 会静默跳过，末档 Noto CJK SC 随系统自带，必定存在。
          所以即使哪天卸掉更纱，这份配置依然是正确的，不用改。
  -->

  <!-- ══ 第一层：基础链（Latin 在前，CJK 紧随其后） ═══════════════════ -->

  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans</string>          <!-- Latin：维持现状 -->
      <string>Sarasa Gothic SC</string>   <!-- 更纱黑体（思源黑体 + Iosevka） -->
      <string>Noto Sans CJK SC</string>   <!-- 兜底：系统自带 -->
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif</string>
      <string>Noto Serif CJK SC</string>  <!-- 兜底 -->
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono</string>     <!-- Latin：维持现状；想全局用 Nerd Font 就改成 MesloLGS Nerd Font -->
      <string>Sarasa Mono SC</string>     <!-- 等宽更纱，中文严格双宽 -->
      <string>Noto Sans Mono CJK SC</string>  <!-- 兜底 -->
    </edit>
  </match>

  <!-- ══ 第二层：标了中文的文本，CJK 顶到第一位 ═══════════════════════ -->

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Sarasa Gothic SC</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Sarasa Mono SC</string>
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>

  <!-- ══ 第三层：日文 / 韩文 / 繁中 各归各位 ═══════════════════════════
       第一层把 SC 钉成了「无语言标记时的默认汉字字形」，这对简中用户是对的，
       但会顺带让日文假名汉字、韩文汉字、繁中也吃到简中字形。
       这里按语言把各自的区域字体顶回第一位。 -->

  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Noto Sans CJK JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Noto Sans CJK TC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Noto Sans CJK HK</string>
    </edit>
  </match>

</fontconfig>
