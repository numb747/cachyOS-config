[Metadata]
Name=Tokyo Night
Name[zh_CN]=东京夜
Version=1
Author=david
Description=Tokyo Night (Storm) theme for fcitx5 — matches tokyonight.nvim
Description[zh_CN]=Tokyo Night (Storm) 配色，与 tokyonight.nvim 保持一致
ScaleWithDPI=True

#
# ── Input panel ────────────────────────────────────────────────────────────
#
[InputPanel]
# 普通候选词 (fg)
NormalColor=#c0caf5
# 选中候选词
HighlightCandidateColor=#c0caf5
# 编码区 (preedit) 中高亮的那一段
HighlightColor=#7dcfff
HighlightBackgroundColor=#292e42
# 序号 / 注释 的字号：整数百分比，不是小数
LabelTextSizeFactor=88
CommentTextSizeFactor=85
FullWidthHighlight=True
PageButtonAlignment=Last Candidate
EnableBlur=False

# 候选序号 1. 2. 3. —— Optional|Color 必须写成子小节里的 Value=
[InputPanel/CandidateLabelColor]
Value=#565f89

[InputPanel/HighlightCandidateLabelColor]
Value=#7dcfff

# 候选注释（拼音 / 提示）
[InputPanel/CandidateCommentColor]
Value=#565f89

[InputPanel/HighlightCandidateCommentColor]
Value=#a9b1d6

[InputPanel/TextMargin]
Left=7
Right=7
Top=5
Bottom=5

[InputPanel/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[InputPanel/Background]
Image=panel.png

[InputPanel/Background/Margin]
Left=12
Right=12
Top=12
Bottom=12

[InputPanel/Highlight]
Image=highlight.png

[InputPanel/Highlight/Margin]
Left=7
Right=7
Top=7
Bottom=7

[InputPanel/PrevPage]
Image=prev.png

[InputPanel/PrevPage/ClickMargin]
Left=4
Right=4
Top=4
Bottom=4

[InputPanel/NextPage]
Image=next.png

[InputPanel/NextPage/ClickMargin]
Left=4
Right=4
Top=4
Bottom=4

#
# ── Menu (托盘菜单 / 输入法切换菜单) ────────────────────────────────────────
#
[Menu]
NormalColor=#c0caf5
HighlightCandidateColor=#ffffff
Spacing=2

[Menu/Background]
Image=panel.png

[Menu/Background/Margin]
Left=12
Right=12
Top=12
Bottom=12

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/TextMargin]
Left=8
Right=8
Top=5
Bottom=5

[Menu/Highlight]
Image=highlight.png

[Menu/Highlight/Margin]
Left=7
Right=7
Top=7
Bottom=7

[Menu/Separator]
Color=#3b4261

[Menu/CheckBox]
Image=radio.png

[Menu/SubMenu]
Image=arrow.png
